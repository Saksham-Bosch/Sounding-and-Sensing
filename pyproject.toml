[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "event-information-platform"
version = "0.0.0"
description = "Event Information Gathering and Dissemination platform scaffold"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
	"pytest>=8",
	"jsonschema>=4",
	"pymupdf>=1.24",
	"imageio-ffmpeg>=0.5",
]
